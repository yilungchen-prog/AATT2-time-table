<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>AATT2 值勤時刻表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="AATT2 值勤">
<meta name="theme-color" content="#121418">
<style>
/* 版面：單欄、大字、單手可按（夜班值勤）。只用深色：和 Android 版同一組夜間配色（core/Palette，對比已在 CoreTest 驗證） */
:root {
  color-scheme: dark;
  --bg: #121418; --card: #1E222A; --card2: #2A3140; --text: #F2F3F5; --sub: #A7ADB8; --ink: #111418;
  --stroke: #9AA4B6; --accent: #6EA8FF; --ok: #5BC07A; --warn: #F2B84B; --danger-text: #FF8A80;
  --primary: #1D4ED8; --danger: #B3261E; --go: #1B6E3A; --urgent: #C62828; --now: #1F7A45; --light: #F2F3F5; --toggle-off: #C9CFDA;
  --lamp: #0D0D0D; --box: #1B1B1B;
  --font: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 24px; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; }
.sub { color: var(--sub); font-size: 14px; }
.small { font-size: 13px; color: var(--sub); }
.warn { color: var(--warn); font-weight: 700; }
.ok { color: var(--ok); font-weight: 700; }
.bad { color: var(--danger-text); font-weight: 700; }
.card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.c2 { background: var(--card2); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1 1 0; min-width: 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.btn { appearance: none; -webkit-appearance: none; display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 56px; padding: 8px 12px; border-radius: 12px; font: 700 18px/1.25 var(--font); color: #fff; text-decoration: none;
  background: var(--card2); border: 2px solid var(--stroke); cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
.btn:active { filter: brightness(1.25); transform: scale(0.99); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.fill { border-color: transparent; }
.btn.primary { background: var(--primary); border-color: transparent; }
.btn.go { background: var(--go); border-color: transparent; }
.btn.now { background: var(--now); border-color: transparent; min-height: 60px; font-size: 19px; }
.btn.danger { background: var(--danger); border-color: transparent; }
.btn.urgent { background: var(--urgent); border-color: transparent; }
.btn.light { background: var(--light); color: var(--ink); border-color: transparent; }
.btn.white-stroke { border: 3px solid #fff; }
.btn.big { min-height: 64px; font-size: 21px; }
.btn.sm { min-height: 52px; font-size: 16px; padding: 6px; }
.toggle { display: flex; align-items: center; gap: 10px; background: var(--card2); border: 2px solid var(--stroke); border-radius: 12px; padding: 6px 6px 6px 16px; min-height: 60px; cursor: pointer; font-weight: 700; font-size: 18px; }
.toggle .name { flex: 1; min-width: 0; }
.pill { display: flex; background: var(--bg); border: 2px solid var(--stroke); border-radius: 12px; padding: 3px; }
.pill span { width: 60px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--sub); font-size: 18px; }
.toggle[aria-checked="true"] .on { background: var(--go); color: #fff; }
.toggle[aria-checked="false"] .off { background: var(--toggle-off); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); height: 40px; }
textarea, input[type=text] { width: 100%; box-sizing: border-box; background: var(--card2); color: var(--text); border: 2px solid var(--stroke); border-radius: 12px; padding: 14px; font: 18px/1.4 var(--font); }
/* 燈箱 */
.box { background: var(--box); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.box .top { display: flex; gap: 10px; align-items: center; }
.lamp { background: var(--lamp); border-radius: 10px; width: 124px; height: 152px; flex: none; display: flex; align-items: center; justify-content: center; }
.lamp canvas { width: 112px; height: 140px; }
.box .right { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.box .cap { font-weight: 700; font-size: 17px; }
.box .digits { font: 700 36px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
.box .caption { text-align: center; font-size: 17px; }
.post-name { font-size: 30px; font-weight: 800; }
/* 提醒畫面 */
.overlay { position: fixed; inset: 0; z-index: 50; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); color: #fff; }
.overlay .inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.overlay .title { font-size: 44px; font-weight: 800; text-align: center; margin-top: 18px; text-wrap: balance; animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
.overlay .tl { font-size: 26px; font-weight: 700; text-align: center; }
.overlay .center { text-align: center; }
@keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .overlay .title { animation: none; } }
/* 底部對話框 */
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.sheet { background: var(--card); border: 1px solid #3A4252; border-radius: 18px; padding: 18px; width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--card2); border: 2px solid var(--stroke); color: var(--text); padding: 12px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); }
.arm { background: #3A2A00; border: 2px solid var(--warn); }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--card2); }
.chip.okc { color: var(--ok); } .chip.badc { color: var(--danger-text); }
table.ev { width: 100%; border-collapse: collapse; font-size: 15px; }
table.ev td { padding: 7px 4px; border-bottom: 1px solid #2A3140; vertical-align: top; }
table.ev td.t { font: 700 15px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.ev tr.past { opacity: .45; }
.err { white-space: pre-wrap; color: var(--danger-text); font-size: 15px; }
a { color: var(--accent); }
.footer { text-align: center; text-wrap: balance; color: var(--accent); font-size: 14px; padding: 8px; cursor: pointer; }
</style>

async function unzipXlsx(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let e = bytes.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("檔案不是有效的 Excel（.xlsx）檔");
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const names = [], datas = [];
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nl)); p += 46 + nl + el + cl;
    if (!(name.endsWith(".xml") || name.endsWith(".rels"))) continue;
    const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true);
    const raw = bytes.subarray(off + 30 + lnl + lel, off + 30 + lnl + lel + csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());

const fired = new Map();   // id → {repeat, at}

  const fresh = due.filter(e => !fired.has(e.id));

function signalBox() {
  const sig = new K.Signal();
  const canvas = h("canvas", { width: 224, height: 280, "aria-hidden": "true" });
  const cap = h("div", { class: "cap" }), digits = h("div", { class: "digits" }), sub = h("div", { class: "sub" }), caption = h("div", { class: "caption" });
  const el = h("div", { class: "box" }, h("div", { class: "top" }, h("div", { class: "lamp" }, canvas), h("div", { class: "right" }, cap, digits, sub)), caption);
  let title = "", subtitle = "", hasItems = false;
  const ctx = canvas.getContext("2d");
  const o = {
    el,
    set(target, urgent, t, st, state, seed, greenMs, low = false, patrol = false) {
      sig.target = target || 0; sig.urgent = urgent; sig.greenMs = greenMs; sig.seed = seed;
      if (state) { sig.setItems(state, low, patrol, true); hasItems = true; } else { sig.clearItems(); hasItems = false; }
      title = t; subtitle = st;
    },
    frame() {

      digits.style.color = r.color;

      sub.textContent = subtitle;

      else if (!r.green) c = r.caption + (r.bonus != null ? "　+" + r.bonus : "");
      caption.textContent = c; caption.hidden = !c;
      return true;
    },
  };
  boxes.add(o);
  return o;
}
const boxes = new Set();

}

let homeBox = null;
function updateHome(force) {
  if (!homeBox || !homeBox.box.el.isConnected) return;
  const t = now(), ev = alerts();
  const cur = ev.filter(e => e.atMillis <= t).pop(), next = ev.find(e => e.atMillis > t);
  homeBox.nowEl.textContent = "現在：" + (!cur ? "尚未上哨" : cur.kind === "OFF_DUTY" ? "已下哨" : cur.kind === "RETURN" ? "原哨" : cur.title);
  homeBox.nextEl.textContent = "下一個：" + (next ? `${C.hhmm(next.at)} ${next.title}` : "今晚結束");
  const id = next ? next.id : -1;
  if (force || id !== homeBox.nextId) {
    if (!force && homeBox.nextId !== null) { render(); return; } // 換到下一段：整頁重排（回報區跟著換）
    homeBox.nextId = id;
    const state = C.sceneOfKind(cur ? cur.kind : null);
    const m = nowMin();
    const title = cur && cur.kind === "TASK" ? cur.task : C.sceneLabel(state);
    const sub = next ? `${C.hhmm(next.at)} ${next.title}` : "今晚結束";
    const seed = (cur ? cur.id : 0) * 31 + day;
    homeBox.box.set(next ? next.atMillis : 0, !!(next && next.handover), title, sub, state, seed, (next ? next.leadMin : 4) * 60000,
      C.isLow(m), !!(cur && cur.kind === "TASK" && cur.task.includes("巡")));
  }
}

function reportCard() {
  const post = postName(), t = now(), ev = alerts();
  const next = ev.find(e => e.atMillis > t), cur = ev.filter(e => e.atMillis <= t).pop();
  const focus = next && next.atMillis - t <= 3 * 60000 ? next : cur;
  const c = h("div", { class: "card" }, h("div", { class: "sub" }, "LINE 回報（不用打字）"));
  if (focus && focus.needsLocation) c.append(btn(`回報「${focus.reportWhat}」← 現在這段`, "now", () => askStandbyPlace(place => { if (focus.needsReport) markReported(focus); return C.standbyDuty(place, post, nowMin()); })));
  else if (focus) c.append(lineLink(`回報「${focus.reportWhat}」← 現在這段`, "now", () => { if (focus.needsReport) markReported(focus); return C.duty(focus.reportWhat, post, nowMin()); }));
  const taskName = cur && cur.kind === "TASK" ? cur.task : "任務";
  const g = h("div", { class: "grid3" });
  for (const w of ["上哨", taskName, "休息", "用餐", "回哨", "下哨"]) {
    g.append(lineLink(w, "sm", () => {
      const k = w === "上哨" ? "ON_DUTY" : w === "回哨" ? "RETURN" : null;
      if (k) { const n = now(); const near = ev.filter(e => e.kind === k && Math.abs(e.atMillis - n) <= 15 * 60000).sort((a, b) => Math.abs(a.atMillis - n) - Math.abs(b.atMillis - n))[0]; if (near) markReported(near); }
      return C.duty(w, post, nowMin());
    }));
  }
  c.append(g, btn("交接未到", "danger", () => handoverSheet(null)));
  return c;
}

function toggle(label, on, cb) {
  const el = h("div", { class: "toggle", role: "switch", tabindex: "0", "aria-checked": String(on), "aria-label": label },
    h("span", { class: "name" }, label), h("span", { class: "pill" }, h("span", { class: "on" }, "開"), h("span", { class: "off" }, "關")));
  const flip = () => { on = !on; el.setAttribute("aria-checked", String(on)); cb(on); };
  el.addEventListener("click", flip); el.addEventListener("keydown", ev => { if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); flip(); } });
  return el;
}

function renderSettings(A) {

function pickRole() {

function testAlert() {
  const e = alerts().find(x => x.kind === "ON_DUTY") || alerts()[0];
  if (!e) { toast("請先選擇哨位"); return; }

function pickFile() {
  const inp = h("input", { type: "file", accept: ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;

      const r = C.load(n, d);
      if (!r.ok) { await loadTimetable(); sheet("匯入失敗", [h("div", { class: "err" }, Array.from(r.errors).join("\n"))], [{ label: "知道了" }]); return; }

      TT = r; source = "匯入：" + f.name; selectedFor = ""; render();

  });

}

// ---------------- 天氣（Open-Meteo；查不到就不顯示） ----------------
async function refreshWeather() {
  const w = S.get("wx");
  if (w && w.day === dayIso() && now() - w.at < 3 * 3600000) return;
  const c = TT.site ? C.coords(TT.site) : null; if (!c) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c[0]}&longitude=${c[1]}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_gusts_10m&timezone=Asia%2FTaipei&forecast_days=3`;
    const j = await (await fetch(url)).json(); const H = j.hourly;
    const arr = (...ns) => ns.map(n => H[n]).find(Boolean);
    const aT = arr("temperature_2m"), aF = arr("apparent_temperature"), aP = arr("precipitation_probability"), aM = arr("precipitation"), aG = arr("wind_gusts_10m", "windgusts_10m"), aC = arr("weather_code", "weathercode");
    const ev = events.length ? events : null;
    const from = ev ? ev.find(e => e.kind === "ON_DUTY").atMillis : null, to = ev ? ev.find(e => e.kind === "OFF_DUTY").atMillis : null;
    if (!from) return;
    let minT = 99, maxT = -99, feels = -99, prob = 0, mm = 0, gust = 0, code = 0, n = 0;
    H.time.forEach((ts, i) => {
      const t = Date.parse(ts + ":00+08:00"); if (t < from || t >= to) return; n++;
      const v = aT?.[i]; if (v != null) { minT = Math.min(minT, v); maxT = Math.max(maxT, v); }
      feels = Math.max(feels, aF?.[i] ?? -99); prob = Math.max(prob, aP?.[i] ?? 0); mm += aM?.[i] ?? 0; gust = Math.max(gust, aG?.[i] ?? 0); code = Math.max(code, aC?.[i] ?? 0);
    });
    if (!n || minT > 90) return;
    const r = C.weather(minT, maxT, feels, prob, mm, gust, code, C.patrolPost());
    S.set("wx", { day: dayIso(), at: now(), summary: r.summary, tags: Array.from(r.tags) });
    const pt = S.get("wxPersona"); if (!pt || pt.day !== dayIso()) S.set("wxPersona", { day: dayIso(), tags: Array.from(r.tags) });
    if (view === "home" && !showing) render();
  } catch (e) { /* 沒網路或被擋：不顯示天氣，其他功能照常 */ }
}

// ---------------- 主迴圈 ----------------
let lastRender = 0;
function tick(force) {
  if (!TT) return;
  if (refreshEvents() && !showing) render();
  checkAlerts();
  checkRadar();
  checkMisc();
  if (view === "home" && !showing) updateHome(false);
  if (force && view === "home" && !showing && now() - lastRender > 1000) { lastRender = now(); render(); }
}

(async function main() {
  try {
    await loadTimetable();
  } catch (e) {
    $("#app").append(h("div", { class: "err" }, "時刻表載入失敗：" + (e.message || e) + "\n這個瀏覽器可能太舊（需要 iOS 16.4 以上）。"));
    return;
  }
  render();
  setInterval(tick, 500);
  requestAnimationFrame(animate);
  refreshWeather(); setInterval(refreshWeather, 30 * 60000);
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
})();
